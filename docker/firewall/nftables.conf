#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;

        # Allow established/related connections
        ct state established,related accept

        # Allow ICMP
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Log and drop suspicious traffic with rate limiting
        limit rate 10/minute log prefix "[FW DENY INPUT] " level warn
        # Drop port scans (multiple SYN to closed ports)
        tcp flags syn tcp dport != { 22, 53, 80, 443, 514 } log prefix "[FW BLOCK SCAN] " drop

        # Allow SSH from management
        ip saddr 172.20.0.0/16 tcp dport 22 accept

        # Allow syslog forwarding
        ip saddr 172.20.0.0/16 tcp dport 514 accept
    }

    chain forward {
        type filter hook forward priority 0; policy accept;

        ct state established,related accept

        # Log forwarded packets
        limit rate 10/minute log prefix "[FW FORWARD] " level info
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
