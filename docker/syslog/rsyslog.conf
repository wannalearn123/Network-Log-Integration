# Load modules
module(load="imtcp")
module(load="imudp")

# TCP listener
input(type="imtcp" port="514")
input(type="imudp" port="514")

# Template: preserve original syslog format with ISO timestamps
template(name="RemoteLog" type="string"
    string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n")

# Template for file-per-host logging
template(name="RemoteLogFile" type="string"
    string="/var/log/remote/%HOSTNAME%.log")

# Write all received logs to per-host files
if $fromhost-ip != '127.0.0.1' then {
    action(type="omfile" dynaFile="RemoteLogFile" template="RemoteLog")
    stop
}

# Local logs
action(type="omfile" file="/var/log/syslog.log" template="RemoteLog")
